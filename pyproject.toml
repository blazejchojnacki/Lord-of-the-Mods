[build-system]
requires = ["scikit-build-core>=0.9.0", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "lord-of-the-mods"
version = "0.1.0"
description = "Modular library for Battle for Middle-earth modifications"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "blazejchojnacki" }
]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
