[build-system]
requires = ["scikit-build-core>=0.9.0", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "lord-of-the-mods"
version = "0.1.0"
description = "Modular Python library and modding toolkit for The Battle for Middle-earth game"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12"
authors = [
    { name = "Błażej Chojnacki" }
]
keywords = [
    "bfme",
    "sage-engine",
    "lotr",
    "big4",
    "modding"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0"
]

[project.scripts]
lotm-big-pack = "lotm.big.cli:main_pack"
lotm-big-unpack = "lotm.big.cli:main_unpack"

[project.urls]
Homepage = "https://github.com/blazejchojnacki/Lord-of-the-Mods"
"Source Code" = "https://github.com/blazejchojnacki/Lord-of-the-Mods"
"Issue Tracker" = "https://github.com/blazejchojnacki/Lord-of-the-Mods/issues"
Changelog = "https://github.com/blazejchojnacki/Lord-of-the-Mods/blob/main/docs/CHANGELOG.md"
Documentation = "https://github.com/blazejchojnacki/Lord-of-the-Mods/blob/main/docs/LIBRARY.md"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
