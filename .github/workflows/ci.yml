name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, 'release/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nanobind ninja
          pip install -e ".[test]"

      - name: Install OpenCppCoverage
        run: |
          choco install opencppcoverage
          echo "C:\Program Files\OpenCppCoverage" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build C++ Extension and Tests
        run: cmake --build build

      - name: Run C++ Native Tests (Catch2)
        run: ctest --test-dir build --output-on-failure

      - name: Run C++ Code Coverage (OpenCppCoverage)
        run: |
          & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" `
            --sources "${{ github.workspace }}\src" `
            --sources "${{ github.workspace }}\include" `
            --excluded_sources "${{ github.workspace }}\tests" `
            --export_type cobertura:cpp-coverage.xml `
            --export_type html:coverage_cpp `
            -- .\build\tests\lotm_cpp_tests.exe

      - name: Upload C++ Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-coverage-report
          path: coverage_cpp/

      - name: Validate Type Stubs and Scripts (Mypy)
        run: python -m mypy src/lotm

      - name: Run Python Integration Tests (Pytest)
        run: python -m pytest --cov=lotm --cov-report=xml tests/python -v

      - name: Build and Validate Wheel
        run: |
          pip install build twine
          python -m build --wheel
          twine check dist/*

      - name: Test Installed Wheel
        run: |
          pip install (Get-Item dist/*.whl).FullName
          lotm-big --help
          lotm-big pack --help
          lotm-big unpack --help
          lotm-big diff --help
          lotm-big overlay --help
          python -m lotm.big --help
