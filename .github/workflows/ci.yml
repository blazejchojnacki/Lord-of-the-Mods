name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, release]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main, release]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nanobind
          pip install -e ".[test]"

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(python -m nanobind --cmake_dir)"

      - name: Build C++ Extension
        run: cmake --build build --config Release -j 4

      - name: Run C++ Native Tests (Catch2)
        working-directory: ${{ github.workspace }}/build
        run: ctest --output-on-failure -C Release

      - name: Run Python Integration Tests (Pytest)
        run: pytest -o pythonpath=".;build/src/cppy_bridge/Release" --cov=scripts --cov-report=xml tests/python -v
