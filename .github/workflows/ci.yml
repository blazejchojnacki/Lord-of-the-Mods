name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
    paths-ignore:
      - '.gitignore'
  pull_request:
    branches: [main, 'release/**']
    paths-ignore:
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nanobind ninja ruff
          pip install -e ".[test]"

      - name: Run Ruff Checks
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Install OpenCppCoverage
        run: |
          choco install opencppcoverage
          echo "C:\Program Files\OpenCppCoverage" >> $env:GITHUB_PATH

      - name: Configure CMake
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON

      - name: Build C++ Extension and Tests
        run: cmake --build build

      - name: Run C++ Native Tests (Catch2)
        run: ctest --test-dir build --output-on-failure

      - name: Run C++ Code Coverage (OpenCppCoverage)
        run: |
          & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" `
            --sources "${{ github.workspace }}\src" `
            --sources "${{ github.workspace }}\include" `
            --excluded_sources "${{ github.workspace }}\tests" `
            --export_type binary:cpp_tests.cov `
            -- .\build\tests\lotm_big_tests.exe
          & "C:\Program Files\OpenCppCoverage\OpenCppCoverage.exe" `
            --sources "${{ github.workspace }}\src" `
            --sources "${{ github.workspace }}\include" `
            --excluded_sources "${{ github.workspace }}\tests" `
            --input_coverage cpp_tests.cov `
            --export_type cobertura:cpp-coverage.xml `
            --export_type html:coverage_cpp `
            -- .\build\tests\lotm_ini_tests.exe

      - name: Upload C++ Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-coverage-report
          path: coverage_cpp/

      - name: Validate Type Stubs and Scripts (Mypy)
        run: python -m mypy src/lotm

      - name: Run Python Doctests (Pytest)
        run: python -m pytest --doctest-modules src/lotm

      - name: Run Python Integration Tests (Pytest)
        run: python -m pytest --cov=lotm --cov-report=xml tests/python -v

      - name: Build and Validate Wheel
        run: |
          pip install build twine
          python -m build --wheel
          twine check dist/*

      - name: Test Built Wheel in Isolated Environment
        shell: pwsh
        run: |
          $wheel = (Get-Item dist/*.whl).FullName
          $isolatedRoot = Join-Path $env:RUNNER_TEMP "wheel-verify"
          $venvDir = Join-Path $isolatedRoot "venv"
          $workDir = Join-Path $isolatedRoot "work"

          if (Test-Path $isolatedRoot) {
            Remove-Item -Recurse -Force $isolatedRoot
          }
          New-Item -ItemType Directory -Path $workDir | Out-Null

          python -m venv $venvDir
          $venvPython = Join-Path $venvDir "Scripts\python.exe"
          $venvLotm = Join-Path $venvDir "Scripts\lotm.exe"
          $venvLotmBig = Join-Path $venvDir "Scripts\lotm-big.exe"

          & $venvPython -m pip install --upgrade pip
          & $venvPython -m pip install $wheel

          Push-Location $workDir
          try {
            & $venvLotm --version
            & $venvLotm --help | Out-Null
            & $venvLotm-big --help | Out-Null
            & $venvPython -m lotm --help | Out-Null
            & $venvPython -c "import lotm, lotm.big, lotm.ini, lotm.pipeline; assert lotm.__version__"
            & $venvPython -m mypy (Join-Path "${{ github.workspace }}" "src\lotm")
            & $venvPython -m pytest --doctest-modules --pyargs lotm
          }
          finally {
            Pop-Location
            Remove-Item -Recurse -Force $isolatedRoot -ErrorAction SilentlyContinue
          }

      - name: Test Installed Wheel
        run: |
          pip install --force-reinstall --no-deps (Get-Item dist/*.whl).FullName
          lotm --version
          lotm --help
          lotm big --help
          lotm ini --help
          lotm ini scan --help
          lotm ini format --help
          lotm ini inspect --help
          lotm-big --version
          lotm-big --help
          lotm-big pack --help
          lotm-big unpack --help
          lotm-big diff --help
          lotm-big overlay --help
          python -m lotm --help
          python -m lotm.big --help
          python -c "import lotm.pipeline; assert hasattr(lotm.pipeline, 'ArchiveEditor')"
